<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Tienda</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="phone-frame">

    <!-- Menú lateral -->
    <div class="menu-overlay" id="menu-overlay"></div>

    <nav class="side-menu" id="side-menu">
      <button class="menu-close" id="menu-close" aria-label="Cerrar menú" type="button">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="#8a4f68" stroke-width="2.2" stroke-linecap="round">
          <line x1="5" y1="5" x2="19" y2="19"/>
          <line x1="19" y1="5" x2="5" y2="19"/>
        </svg>
      </button>
      <ul class="menu-list">
        <li><a href="#">Inicio</a></li>
        <li><a href="#">Gacha</a></li>
        <li><a href="#">Armario</a></li>
        <li><a href="#">Favoritos</a></li>
        <li><a href="#">Ajustes</a></li>
      </ul>
    </nav>

    <!-- Carrito lateral -->
    <div class="cart-overlay" id="cart-overlay"></div>

    <nav class="cart-drawer" id="cart-drawer">
      <button class="menu-close" id="cart-close" aria-label="Cerrar carrito" type="button">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="#8a4f68" stroke-width="2.2" stroke-linecap="round">
          <line x1="5" y1="5" x2="19" y2="19"/>
          <line x1="19" y1="5" x2="5" y2="19"/>
        </svg>
      </button>
      <div class="cart-empty">
        <svg viewBox="0 0 24 24" width="40" height="40" fill="none" stroke="#c98aa3" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="9" cy="21" r="1.4" fill="#c98aa3" stroke="none"/>
          <circle cx="19" cy="21" r="1.4" fill="#c98aa3" stroke="none"/>
          <path d="M1 1h3.2l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/>
        </svg>
        <p>Tu carrito está vacío</p>
      </div>
    </nav>

    <!-- Lista de deseos lateral -->
    <div class="cart-overlay" id="wishlist-overlay"></div>

    <nav class="cart-drawer" id="wishlist-drawer">
      <button class="menu-close" id="wishlist-close" aria-label="Cerrar lista de deseos" type="button">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="#8a4f68" stroke-width="2.2" stroke-linecap="round">
          <line x1="5" y1="5" x2="19" y2="19"/>
          <line x1="19" y1="5" x2="5" y2="19"/>
        </svg>
      </button>
      <div class="cart-empty">
        <svg viewBox="0 0 24 24" width="40" height="40" fill="none" stroke="#c98aa3" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 20.5S3 15 3 8.7C3 5.5 5.5 3 8.6 3c1.7 0 3.3.8 4.4 2.2C14.1 3.8 15.7 3 17.4 3 20.5 3 23 5.5 23 8.7c0 6.3-9 11.8-9 11.8z" transform="translate(-1)"/>
        </svg>
        <p>Tu lista de deseos está vacía</p>
      </div>
    </nav>

    <!-- Barra Superior: Navegación y Contadores -->
    <div class="top-bar">
      <nav class="top-nav">
        <button class="btn-back" id="menu-open" aria-label="Abrir menú" type="button">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round">
            <line x1="3" y1="6" x2="21" y2="6"/>
            <line x1="3" y1="12" x2="21" y2="12"/>
            <line x1="3" y1="18" x2="21" y2="18"/>
          </svg>
        </button>

        <div class="counters">
          <div class="counter-pill">
            <span class="counter-icon coin-icon"></span>
            <span class="counter-value">34</span>
            <button id="btn-carrito" class="counter-add" aria-label="Ir al carrito" type="button">+</button>
          </div>
          <div class="counter-pill">
            <span class="counter-icon gem-icon"></span>
            <span class="counter-value">0</span>
            <button id="btn-wishlist" class="counter-add" aria-label="Ir a la lista de deseos" type="button">+</button>
          </div>
        </div>

        <button class="btn-cart" id="cart-open" aria-label="Carrito" type="button">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="#000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="9" cy="21" r="1.4" fill="#000" stroke="none"/>
            <circle cx="19" cy="21" r="1.4" fill="#000" stroke="none"/>
            <path d="M1 1h3.2l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/>
          </svg>
        </button>
      </nav>
    </div>

    <main class="content">

      <!-- Banners Principales -->
      <section class="main-banners">
        <div class="banner-card">
          <img src="banner1.jpg" alt="Banner promoción 1">
        </div>
        <div class="banner-card">
          <img src="banner2.jpg" alt="Banner promoción 2">
        </div>
      </section>

      <!-- Banner Medio -->
      <button class="mid-banner">
        <img src="banner-coleccion.jpg" alt="Nueva Colección">
      </button>

      <!-- Grid de Categorías -->
      <section class="category-grid">
        <button class="category-btn cat-1">
          <span class="cat-icon">
            <img src="cat-icon-1.png" alt="Remeras">
          </span>
          <span class="cat-label">Remeras</span>
        </button>
        <button class="category-btn cat-2">
          <span class="cat-icon">
            <img src="cat-icon-2.png" alt="Shorts">
          </span>
          <span class="cat-label">Shorts</span>
        </button>
        <button class="category-btn cat-3">
          <span class="cat-icon">
            <img src="cat-icon-3.png" alt="Accesorios">
          </span>
          <span class="cat-label">Accesorios</span>
        </button>
        <button class="category-btn cat-4">
          <span class="cat-icon">
            <img src="cat-icon-4.png" alt="Jeans">
          </span>
          <span class="cat-label">Jeans</span>
        </button>
        <button class="category-btn cat-5">
          <span class="cat-icon">
            <img src="cat-icon-5.png" alt="Pollera">
          </span>
          <span class="cat-label">Pollera</span>
        </button>
        <button class="category-btn cat-6">
          <span class="cat-icon">
            <img src="cat-icon-6.png" alt="Contacto">
          </span>
          <span class="cat-label">Contacto</span>
        </button>
      </section>

    </main>
  </div>

  <script>
    const openBtn = document.getElementById('menu-open');
    const closeBtn = document.getElementById('menu-close');
    const overlay = document.getElementById('menu-overlay');
    const sideMenu = document.getElementById('side-menu');

    function openMenu() {
      sideMenu.classList.add('open');
      overlay.classList.add('visible');
    }

    function closeMenu() {
      sideMenu.classList.remove('open');
      overlay.classList.remove('visible');
    }

    openBtn.addEventListener('click', openMenu);
    closeBtn.addEventListener('click', closeMenu);
    overlay.addEventListener('click', closeMenu);
    document.querySelectorAll('.menu-list a').forEach(function (link) {
      link.addEventListener('click', closeMenu);
    });

    const cartOpenBtn = document.getElementById('cart-open');
    const cartAddBtn = document.getElementById('btn-carrito');
    const cartCloseBtn = document.getElementById('cart-close');
    const cartOverlay = document.getElementById('cart-overlay');
    const cartDrawer = document.getElementById('cart-drawer');

    function openCart() {
      cartDrawer.classList.add('open');
      cartOverlay.classList.add('visible');
    }

    function closeCart() {
      cartDrawer.classList.remove('open');
      cartOverlay.classList.remove('visible');
    }

    cartOpenBtn.addEventListener('click', openCart);
    cartAddBtn.addEventListener('click', openCart);
    cartCloseBtn.addEventListener('click', closeCart);
    cartOverlay.addEventListener('click', closeCart);

    const wishlistOpenBtn = document.getElementById('btn-wishlist');
    const wishlistCloseBtn = document.getElementById('wishlist-close');
    const wishlistOverlay = document.getElementById('wishlist-overlay');
    const wishlistDrawer = document.getElementById('wishlist-drawer');

    function openWishlist() {
      wishlistDrawer.classList.add('open');
      wishlistOverlay.classList.add('visible');
    }

    function closeWishlist() {
      wishlistDrawer.classList.remove('open');
      wishlistOverlay.classList.remove('visible');
    }

    wishlistOpenBtn.addEventListener('click', openWishlist);
    wishlistCloseBtn.addEventListener('click', closeWishlist);
    wishlistOverlay.addEventListener('click', closeWishlist);
  </script>
</body>
</html>
