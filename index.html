<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Tienda</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="phone-frame">

    <!-- Barra Superior: Ticker -->
    <div class="ticker-bar">
      <div class="ticker-track">
        <span>🔥 Novedades - Envíos a todo el país 🔥</span>
        <span>🔥 Novedades - Envíos a todo el país 🔥</span>
      </div>
    </div>

    <!-- Encabezado -->
    <header class="header">
      <div class="banner-flag banner-flag-left"></div>
      <div class="banner-flag banner-flag-right"></div>
      <h1 class="shop-title"><span class="sparkle">✦</span> Mi Tienda <span class="sparkle">✦</span></h1>
    </header>

    <main class="content">

      <!-- Banners Principales -->
      <section class="main-banners">
        <div class="banner-card">
          <span class="tag tag-sale">Sale!</span>
          <img src="banner1.jpg" alt="Banner promoción 1">
          <div class="banner-caption">Trend Style</div>
        </div>
        <div class="banner-card">
          <span class="tag tag-new">Nuevo</span>
          <img src="banner2.jpg" alt="Banner promoción 2">
          <div class="banner-caption">Casual Look</div>
        </div>
      </section>

      <!-- Banner Medio -->
      <button class="mid-banner">
        <span class="mid-banner-icon">🎀</span>
        <span class="mid-banner-text">Nueva Colección</span>
      </button>

      <!-- Grid de Categorías -->
      <section class="category-grid">
        <button class="category-btn cat-1">
          <span class="cat-icon">🛹</span>
          <span class="cat-label">Streetwear Y2K</span>
        </button>
        <button class="category-btn cat-2">
          <span class="cat-icon">👖</span>
          <span class="cat-label">Denim Vintage</span>
        </button>
        <button class="category-btn cat-3">
          <span class="cat-icon">🖨️</span>
          <span class="cat-label">Custom DTF</span>
        </button>
        <button class="category-btn cat-4">
          <span class="cat-icon">👕</span>
          <span class="cat-label">Básicos</span>
        </button>
        <button class="category-btn cat-5">
          <span class="cat-icon">🏷️</span>
          <span class="cat-label">Sale</span>
        </button>
        <button class="category-btn cat-6">
          <span class="cat-icon">💌</span>
          <span class="cat-label">Contacto</span>
        </button>
      </section>

    </main>
  </div>
</body>
</html>
