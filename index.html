<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Tienda</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="phone-frame">

    <!-- Barra Superior: Navegación y Contadores -->
    <div class="top-bar">
      <nav class="top-nav">
        <button class="btn-back" aria-label="Volver">
          <span class="arrow-icon">&larr;</span>
        </button>

        <div class="counters">
          <div class="counter-pill">
            <span class="counter-icon coin-icon"></span>
            <span class="counter-value">34</span>
            <span class="counter-add">+</span>
          </div>
          <div class="counter-pill">
            <span class="counter-icon gem-icon"></span>
            <span class="counter-value">0</span>
            <span class="counter-add">+</span>
          </div>
        </div>

        <button class="btn-cart" aria-label="Carrito">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="#000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="9" cy="21" r="1.4" fill="#000" stroke="none"/>
            <circle cx="19" cy="21" r="1.4" fill="#000" stroke="none"/>
            <path d="M1 1h3.2l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/>
          </svg>
        </button>
      </nav>
    </div>

    <!-- Encabezado -->
    <header class="header">
      <h1 class="shop-title">Mi Tienda</h1>
    </header>

    <main class="content">

      <!-- Banners Principales -->
      <section class="main-banners">
        <div class="banner-card">
          <img src="banner1.jpg" alt="Banner promoción 1">
        </div>
        <div class="banner-card">
          <img src="banner2.jpg" alt="Banner promoción 2">
        </div>
      </section>

      <!-- Banner Medio -->
      <button class="mid-banner">
        <span class="mid-banner-icon">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="#8a4f68" stroke="#8a4f68" stroke-width="1.4" stroke-linejoin="round">
            <path d="M3 6c-1.5 1.5-1.5 10.5 0 12 1.5 1.5 8-4 9-6-1-2-7.5-7.5-9-6z"/>
            <path d="M21 6c1.5 1.5 1.5 10.5 0 12-1.5 1.5-8-4-9-6 1-2 7.5-7.5 9-6z"/>
            <circle cx="12" cy="12" r="2.6" fill="#fff" stroke="#8a4f68" stroke-width="1.4"/>
          </svg>
        </span>
        <span class="mid-banner-text">Nueva Colección</span>
      </button>

      <!-- Grid de Categorías -->
      <section class="category-grid">
        <button class="category-btn cat-1">
          <span class="cat-icon">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#8a4f68" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <rect x="2" y="10" width="20" height="3" rx="1.5"/>
              <circle cx="6" cy="17" r="2"/>
              <circle cx="18" cy="17" r="2"/>
            </svg>
          </span>
          <span class="cat-label">Streetwear Y2K</span>
        </button>
        <button class="category-btn cat-2">
          <span class="cat-icon">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#8a4f68" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <rect x="5" y="3" width="14" height="4" rx="1"/>
              <rect x="5" y="8" width="6" height="13" rx="1.5"/>
              <rect x="13" y="8" width="6" height="13" rx="1.5"/>
            </svg>
          </span>
          <span class="cat-label">Denim Vintage</span>
        </button>
        <button class="category-btn cat-3">
          <span class="cat-icon">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#8a4f68" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M6 9V3h12v6"/>
              <rect x="4" y="9" width="16" height="8" rx="1.5"/>
              <path d="M6 17h12v5H6z"/>
            </svg>
          </span>
          <span class="cat-label">Custom DTF</span>
        </button>
        <button class="category-btn cat-4">
          <span class="cat-icon">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#8a4f68" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M8 4 4 7v3h3v10h10V10h3V7l-4-3-3 2-3-2z"/>
            </svg>
          </span>
          <span class="cat-label">Básicos</span>
        </button>
        <button class="category-btn cat-5">
          <span class="cat-icon">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#8a4f68" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20 10.5 13.5 4H5a1 1 0 0 0-1 1v8.5l6.5 6.5a1.5 1.5 0 0 0 2 0l7.5-7.5a1.5 1.5 0 0 0 0-2z"/>
              <circle cx="8.5" cy="8.5" r="1.1" fill="#8a4f68" stroke="none"/>
            </svg>
          </span>
          <span class="cat-label">Sale</span>
        </button>
        <button class="category-btn cat-6">
          <span class="cat-icon">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#8a4f68" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="5" width="18" height="14" rx="2"/>
              <path d="M3 7l9 6 9-6"/>
            </svg>
          </span>
          <span class="cat-label">Contacto</span>
        </button>
      </section>

    </main>
  </div>
</body>
</html>
